<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b6472"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="920" fill="#f6f8fb"/>

  <!-- 标题 -->
  <text x="700" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e293b">AI 漫剧智能制作平台 · 系统四层架构</text>
  <text x="700" y="80" text-anchor="middle" font-size="15" fill="#64748b">前端 / 应用 / 编排执行 / 生成与存储</text>

  <!-- ==================== 第一层:前端层 ==================== -->
  <g>
    <rect x="60" y="104" width="1280" height="158" rx="14" fill="#e8f1ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="60" y="104" width="150" height="158" rx="14" fill="#2563eb"/>
    <rect x="150" y="104" width="60" height="158" fill="#2563eb"/>
    <text x="135" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">前端层</text>
    <text x="135" y="202" text-anchor="middle" font-size="13" fill="#dbeafe">Presentation</text>

    <g font-size="15" fill="#1e3a8a">
      <rect x="240" y="126" width="200" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="340" y="148" text-anchor="middle" font-weight="bold">技术栈</text>
      <text x="340" y="168" text-anchor="middle" font-size="13">Vue 3 · Vite · Pinia</text>

      <rect x="460" y="126" width="200" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="560" y="148" text-anchor="middle" font-weight="bold">UI 组件库</text>
      <text x="560" y="168" text-anchor="middle" font-size="13">Element Plus · Axios</text>

      <rect x="680" y="126" width="310" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="835" y="148" text-anchor="middle" font-weight="bold">核心页面</text>
      <text x="835" y="168" text-anchor="middle" font-size="13">创作灵感 · 项目管理 · 集/镜头详情</text>

      <rect x="1010" y="126" width="300" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="1160" y="148" text-anchor="middle" font-weight="bold">交互能力</text>
      <text x="1160" y="168" text-anchor="middle" font-size="13">拖拽导入 · 任务进度实时刷新</text>

      <rect x="240" y="192" width="1070" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="775" y="224" text-anchor="middle" font-size="14">创作入口(文本/文件灵感) → 剧本确认 → 角色/分镜编辑 → 视频合成预览与下载</text>
    </g>
  </g>

  <!-- 箭头 1→2 -->
  <g>
    <line x1="500" y1="262" x2="500" y2="300" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="900" y1="300" x2="900" y2="262" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="640" y="288" text-anchor="middle" font-size="14" fill="#475569">HTTP REST API ↓ / SSE 实时事件流 ↑</text>
  </g>

  <!-- ==================== 第二层:应用层 ==================== -->
  <g>
    <rect x="60" y="304" width="1280" height="158" rx="14" fill="#e9f9f0" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="60" y="304" width="150" height="158" rx="14" fill="#059669"/>
    <rect x="150" y="304" width="60" height="158" fill="#059669"/>
    <text x="135" y="376" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">应用层</text>
    <text x="135" y="402" text-anchor="middle" font-size="13" fill="#d1fae5">Application</text>

    <g font-size="15" fill="#065f46">
      <rect x="240" y="326" width="200" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="340" y="348" text-anchor="middle" font-weight="bold">Web 框架</text>
      <text x="340" y="368" text-anchor="middle" font-size="13">FastAPI · Uvicorn:8010</text>

      <rect x="460" y="326" width="200" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="560" y="348" text-anchor="middle" font-weight="bold">认证与安全</text>
      <text x="560" y="368" text-anchor="middle" font-size="13">JWT · 用户体系</text>

      <rect x="680" y="326" width="310" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="835" y="348" text-anchor="middle" font-weight="bold">REST 路由模块</text>
      <text x="835" y="368" text-anchor="middle" font-size="13">projects · episodes · characters</text>

      <rect x="1010" y="326" width="300" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="1160" y="348" text-anchor="middle" font-weight="bold">storyboards · shots · tasks</text>
      <text x="1160" y="368" text-anchor="middle" font-size="13">timelines · styles · auth</text>

      <rect x="240" y="392" width="1070" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="775" y="424" text-anchor="middle" font-size="14">Pydantic Schema 参数校验 · SQLAlchemy ORM · SSE 事件推送(sse.py / event_bus) · 风格预设管理</text>
    </g>
  </g>

  <!-- 箭头 2→3 -->
  <g>
    <line x1="700" y1="462" x2="700" y2="500" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="720" y="488" font-size="14" fill="#475569">任务入队(线程安全) / 状态回查</text>
  </g>

  <!-- ==================== 第三层:编排执行层 ==================== -->
  <g>
    <rect x="60" y="504" width="1280" height="158" rx="14" fill="#fff4e6" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="60" y="504" width="150" height="158" rx="14" fill="#d97706"/>
    <rect x="150" y="504" width="60" height="158" fill="#d97706"/>
    <text x="135" y="568" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">编排执行层</text>
    <text x="135" y="594" text-anchor="middle" font-size="13" fill="#fef3c7">Orchestration</text>

    <g font-size="15" fill="#78350f">
      <rect x="240" y="526" width="270" height="52" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="375" y="548" text-anchor="middle" font-weight="bold">异步任务引擎 task_engine</text>
      <text x="375" y="568" text-anchor="middle" font-size="13">asyncio · 状态机 · 幂等 · 重试</text>

      <rect x="530" y="526" width="270" height="52" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="665" y="548" text-anchor="middle" font-weight="bold">并发与限流控制</text>
      <text x="665" y="568" text-anchor="middle" font-size="13">视频串行 · 图像≤2 · 429 指数退避</text>

      <rect x="820" y="526" width="240" height="52" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="940" y="548" text-anchor="middle" font-weight="bold">AI 编剧 Agent</text>
      <text x="940" y="568" text-anchor="middle" font-size="13">writer.py · 剧本/分镜生成</text>

      <rect x="1080" y="526" width="230" height="52" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="1195" y="548" text-anchor="middle" font-weight="bold">合成器 compositor</text>
      <text x="1195" y="568" text-anchor="middle" font-size="13">FFmpeg 时间轴拼接</text>

      <rect x="240" y="592" width="1070" height="52" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="775" y="624" text-anchor="middle" font-size="14">流水线:剧本生成 → 角色定妆(参考图) → 分镜出图 → 图生视频 → TTS 配音 → 字幕合成 → 1080×1920 成片</text>
    </g>
  </g>

  <!-- 箭头 3→4 -->
  <g>
    <line x1="500" y1="662" x2="500" y2="700" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="900" y1="700" x2="900" y2="662" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="700" y="688" text-anchor="middle" font-size="14" fill="#475569">Provider 适配调用 ↓ / 产物回传 ↑</text>
  </g>

  <!-- ==================== 第四层:生成与存储层 ==================== -->
  <g>
    <rect x="60" y="704" width="1280" height="158" rx="14" fill="#f1ecfd" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="60" y="704" width="150" height="158" rx="14" fill="#7c3aed"/>
    <rect x="150" y="704" width="60" height="158" fill="#7c3aed"/>
    <text x="135" y="768" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">生成与存储层</text>
    <text x="135" y="794" text-anchor="middle" font-size="13" fill="#ede9fe">Generation</text>

    <g font-size="15" fill="#4c1d95">
      <rect x="240" y="726" width="270" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="375" y="748" text-anchor="middle" font-weight="bold">Agnes AI 服务</text>
      <text x="375" y="768" text-anchor="middle" font-size="13">api.agnes-ai.cn · 文生图 · 图生视频</text>

      <rect x="530" y="726" width="270" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="665" y="748" text-anchor="middle" font-weight="bold">语音合成 TTS</text>
      <text x="665" y="768" text-anchor="middle" font-size="13">DashScope 旁白配音</text>

      <rect x="820" y="726" width="240" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="940" y="748" text-anchor="middle" font-weight="bold">关系数据库</text>
      <text x="940" y="768" text-anchor="middle" font-size="13">SQLite · SQLAlchemy ORM</text>

      <rect x="1080" y="726" width="230" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="1195" y="748" text-anchor="middle" font-weight="bold">本地文件存储</text>
      <text x="1195" y="768" text-anchor="middle" font-size="13">output/ · 图片/视频/成片</text>

      <rect x="240" y="792" width="1070" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="775" y="824" text-anchor="middle" font-size="14">统一 Provider 抽象(services/providers):模型参数封装 · seed 约束 [-1,999] · 风格预设注入 · 产物落盘与 URL 回传</text>
    </g>
  </g>

  <!-- 底部注释 -->
  <text x="700" y="898" text-anchor="middle" font-size="13" fill="#94a3b8">数据自上而下逐层调用、产物与事件自下而上逐层回流;编排执行层保证全链路可重试、可恢复。</text>
</svg>
