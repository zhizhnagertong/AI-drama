name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # pydantic-settings 会直接读取环境变量，CI 中无需创建 backend/.env
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ai_manga_studio_ci
      JWT_SECRET: ci-only-secret-not-for-production
      LOG_RESET_CODE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行后端测试
        working-directory: backend
        run: python -m pytest app/tests -q

  frontend-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本项目 pnpm-workspace.yaml 的语义对齐（pnpm 11 起配置项迁至该文件）
          version: 11

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13，Node 20 会因缺少 node:sqlite 内置模块直接崩溃
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend-react
        # 跳过生命周期脚本：esbuild 的二进制来自 @esbuild/* 可选依赖，无需 postinstall，
        # 而 CI 里放行构建脚本会因 strictDepBuilds 直接中断安装。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 类型检查 + 单元测试
        working-directory: frontend-react
        run: |
          pnpm typecheck
          pnpm test